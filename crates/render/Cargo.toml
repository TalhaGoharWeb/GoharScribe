[package]
name = "goharscribe-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GoharScribe rasteriser: pages and thumbnails from the layout display list (vello_cpu), PNG/JPEG export"

[lints]
workspace = true

[dependencies]
goharscribe-geom = { workspace = true }
goharscribe-doc = { workspace = true }
goharscribe-fonts = { workspace = true }
goharscribe-layout = { workspace = true }
vello_cpu = { workspace = true }
image = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
