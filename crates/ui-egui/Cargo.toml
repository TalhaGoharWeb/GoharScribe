workspace = true

[dependencies]
goharscribe-geom = { workspace = true }
goharscribe-doc = { workspace = true }
goharscribe-fonts = { workspace = true }
goharscribe-layout = { workspace = true }
goharscribe-render = { workspace = true }
goharscribe-engine = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
image = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
