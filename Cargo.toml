[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/goharscribe", "apps/goharscribe-cli", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/TalhaGoharWeb/goharscribe"

[workspace.dependencies]
# internal
goharscribe-geom = { path = "crates/geom" }
goharscribe-doc = { path = "crates/doc" }
goharscribe-fonts = { path = "crates/fonts" }
goharscribe-layout = { path = "crates/layout" }
goharscribe-docx = { path = "crates/docx" }
goharscribe-formats = { path = "crates/formats" }
goharscribe-render = { path = "crates/render" }
goharscribe-pdf = { path = "crates/pdf" }
goharscribe-proof = { path = "crates/proof" }
goharscribe-engine = { path = "crates/engine" }
goharscribe-mcp = { path = "crates/mcp" }
goharscribe-server = { path = "crates/server" }
goharscribe-ui-egui = { path = "crates/ui-egui" }
goharscribe-input = { path = "crates/input" }

# SaaS backend
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
rusqlite = { version = "0.31", features = ["bundled"] }
jsonwebtoken = "9"
argon2 = "0.5"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand_core = { version = "0.6", features = ["getrandom"] }

# foundation
kurbo = { version = "0.13", features = ["serde"] }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
proptest = "1"
rayon = "1"
unicode-bidi = "0.3"
unicode-segmentation = "1"
unicode-linebreak = "0.1"
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
getrandom = "0.3"

# text / rendering / formats
skrifa = "0.47"
harfrust = "0.13"
vello_cpu = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
krilla = { version = "0.8", features = ["pdf"] }
quick-xml = "0.41"
zip = { version = "3", default-features = false, features = ["deflate"] }

# ui
egui = "0.36"
egui_extras = { version = "0.36", default-features = false }
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"
arboard = { version = "3.6", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
